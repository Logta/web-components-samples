packages:
  - "packages/*"
  - "demo/*"

catalog:
  vite: 8.3.5
  typescript: 7.0.2
  # React (shared version for @lit/react based packages)
  # Used by: demo/react, packages/lit, packages/lit-tailwind
  react: ^19.3.1
  react-dom: ^19.3.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0

allowBuilds:
  '@swc/core': true
  esbuild: true

packageExtensions:
  '@headlessui/react':
    peerDependencies:
      '@types/react': '*'
      '@types/react-dom': '*'
