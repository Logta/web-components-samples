# =============================================================================
# Tools Configuration
# =============================================================================
[tools]
node = "26.13.0"
pnpm = "12.16.1"
go = "1.27.3"
ruby = "4.0.9"

# =============================================================================
# Environment Variables
# =============================================================================
[env]
# Ruby build configuration for macOS with Homebrew libyaml
_.source = """
if command -v brew >/dev/null 2>&1; then
  export RUBY_CONFIGURE_OPTS="--with-libyaml-dir=$(brew --prefix libyaml)"
fi
"""

# =============================================================================
# Package Development Tasks
# =============================================================================

[tasks.clean]
description = "Clean all build artifacts"
run = "pnpm clean || rm -rf packages/*/dist demo/*/node_modules/.vite"

[tasks.install]
description = "Install all project dependencies"
run = "pnpm install"
alias = "i"

[tasks.dev]
description = "Start development servers for all packages"
run = "pnpm dev"
alias = "d"

[tasks.build]
description = "Build all packages for production"
run = "pnpm build"
alias = "b"

[tasks.preview]
description = "Build and preview all packages"
depends = ["build"]
run = "pnpm preview"

[tasks.test]
description = "Run tests for all packages"
run = "pnpm test"
alias = "t"

# =============================================================================
# Storybook Tasks
# =============================================================================

[tasks.storybook]
description = "Start Storybook development server"
run = "pnpm storybook"
alias = "sb"

[tasks."storybook:build"]
description = "Build Storybook for production"
run = "pnpm build-storybook"

# =============================================================================
# Demo Tasks - Setup
# =============================================================================

[tasks."demo:setup"]
description = "Setup all demos (build components and configure)"
depends = ["build", "demo:setup-rails", "demo:setup-go"]

[tasks."demo:setup-rails"]
description = "Setup Rails demo (build & copy components, install gems, setup DB)"
run = """
cd demo/rails
./setup_components.sh
bundle install
bundle exec rails db:create db:migrate
"""

[tasks."demo:setup-go"]
description = "Setup Go demo (build & copy components)"
run = "cd demo/go && ./setup_components.sh"

[tasks."demo:setup-iframe"]
description = "Setup iframe-server (build & copy components)"
run = "cd packages/iframe-server && ./setup_components.sh"

# =============================================================================
# Demo Tasks - Development Servers
# =============================================================================

[tasks."demo:react"]
description = "🚀 React Demo - http://localhost:3000"
run = "cd demo/react && pnpm dev"
alias = "dr"

[tasks."demo:vanilla"]
description = "🚀 Vanilla JS Demo - http://localhost:3001"
run = "cd demo/vanillajs && pnpm dev"
alias = "dv"

[tasks."demo:rails"]
description = "🚀 Rails Demo - http://localhost:3002"
run = "cd demo/rails && bundle exec rails server -p 3002"
alias = "drails"

[tasks."demo:go"]
description = "🚀 Go Demo - http://localhost:8080"
run = "cd demo/go && go run main.go"
alias = "dgo"

[tasks."iframe-server"]
description = "🚀 iframe Test Server - http://localhost:4001"
run = "cd packages/iframe-server && pnpm dev"
alias = "iframe"

# =============================================================================
# Demo Tasks - Shortcuts
# =============================================================================

[tasks."demo:list"]
description = "List all available demos"
alias = "dl"
run = """
echo "📦 Available Demos:"
echo ""
echo "  React      → mise demo:react      (port 3000)"
echo "  Vanilla JS → mise demo:vanilla    (port 3001)"
echo "  Rails      → mise demo:rails      (port 3002)"
echo "  Go         → mise demo:go         (port 8080)"
echo "  iframe     → mise iframe-server   (port 4001)"
echo ""
echo "💡 Tip: Setup Rails/Go/iframe demos first with 'mise demo:setup'"
echo "💡 Run multiple demos: mise demo:frontend OR mise demo:backend"
"""

[tasks."demo:frontend"]
description = "Start frontend demos (React + Vanilla JS)"
run = """
echo "🚀 Starting frontend demos..."
echo "  React      → http://localhost:3000"
echo "  Vanilla JS → http://localhost:3001"
echo ""
(cd demo/react && pnpm dev) &
(cd demo/vanillajs && pnpm dev) &
wait
"""

[tasks."demo:backend"]
description = "Start backend demos (Rails + Go)"
run = """
echo "🚀 Starting backend demos..."
echo "  Rails → http://localhost:3002"
echo "  Go    → http://localhost:8080"
echo ""
echo "⚠️  Make sure you ran 'mise demo:setup' first!"
echo ""
(cd demo/rails && bundle exec rails server -p 3002) &
(cd demo/go && go run main.go) &
wait
"""

[tasks."demo:all"]
description = "Start ALL demos (React + Vanilla + Rails + Go)"
run = """
echo "🚀 Starting ALL demos..."
echo "  React      → http://localhost:3000"
echo "  Vanilla JS → http://localhost:3001"
echo "  Rails      → http://localhost:3002"
echo "  Go         → http://localhost:8080"
echo ""
echo "⚠️  Make sure you ran 'mise demo:setup' first!"
echo "⚠️  Logs from all 4 servers will be mixed. Press Ctrl+C to stop all."
echo ""
(cd demo/react && pnpm dev) &
(cd demo/vanillajs && pnpm dev) &
(cd demo/rails && bundle exec rails server -p 3002) &
(cd demo/go && go run main.go) &
wait
"""

# =============================================================================
# Utility Tasks
# =============================================================================

[tasks.fmt]
description = "Format all code (Biome, rubocop, gofmt)"
run = """
pnpm biome format --write .
cd demo/rails && bundle exec rubocop -A || true
cd demo/go && go fmt ./... || true
"""

[tasks.lint]
description = "Lint and fix code with Biome"
run = "pnpm biome lint --write ."

[tasks.check]
description = "Run all checks (Biome check, type-check, test)"
run = "pnpm biome check --write . && pnpm type-check && pnpm test"

[tasks."check:ci"]
description = "Run CI checks (Biome CI mode)"
run = "pnpm biome ci ."

[tasks.help]
description = "Show available tasks"
run = "mise tasks"
alias = "h"
