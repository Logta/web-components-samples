[tools]
node = "24.3.0"
pnpm = "10.12.3"

[env]
# プロジェクト固有の環境変数をここに追加できます

[tasks.dev]
description = "Run development servers for all packages"
run = "pnpm dev"

[tasks.build]
description = "Build all packages"
run = "pnpm build"

[tasks.preview]
description = "Build and preview all packages"
depends = ["build"]
run = "pnpm preview"

[tasks.install]
description = "Install dependencies"
run = "pnpm install"

[tasks.storybook]
description = "Run Storybook development server"
run = "pnpm storybook"

[tasks."storybook:build"]
description = "Build Storybook for production"
run = "pnpm build-storybook"
