<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Components in Vanilla JS Demo</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app">
      <h1>Web Components in Vanilla JS Demo</h1>
      <p>このデモでは、純粋なJavaScript環境で5つの異なるWeb Componentsを使用しています。</p>

      <div class="counters-grid">
        <my-counter count="0"></my-counter>
        <react-counter count="0"></react-counter>
        <lit-counter count="0"></lit-counter>
        <preact-counter count="0"></preact-counter>
        <svelte-counter count="0"></svelte-counter>
      </div>

      <div class="info">
        <h3>使い方</h3>
        <p>各カウンターの + / - ボタンをクリックして、カウンターを操作できます。</p>
        <p>フレームワークを使わなくても、標準のWeb Components APIだけでインタラクティブなUIを構築できます。</p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
