{{define "content"}}
<div class="container">
    <h1>{{.Title}}</h1>
    <p>{{.Description}}</p>

    <div class="counters-grid">
        <my-counter count="0"></my-counter>
        <react-counter count="0"></react-counter>
        <lit-counter count="0"></lit-counter>
        <preact-counter count="0"></preact-counter>
        <svelte-counter count="0"></svelte-counter>
    </div>

    <div class="info">
        <h3>使い方</h3>
        <p>各カウンターの + / - ボタンをクリックして、カウンターを操作できます。</p>
        <p>Goのhtml/templateでHTMLを生成し、Web Componentsでインタラクティブ性を追加します。</p>
        <p>Goの標準ライブラリだけで、モダンなインタラクティブWebアプリケーションを構築できます。</p>
    </div>
</div>
{{end}}
